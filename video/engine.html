<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

</div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const outCubic=x=>1-Math.pow(1-x,3);

function mk(parent,cls,css,html){const d=document.createElement('div');d.className=cls;Object.assign(d.style,css||{});if(html!=null)d.innerHTML=html;parent.appendChild(d);return d}
function T(parent,y,size,html,cls=''){return mk(parent,'abs b '+cls,{top:y+'px',fontSize:size+'px'},html)}
function pop(el,t,a,dur=.5,y=40){const p=lin(t,a,a+dur);el.style.opacity=clamp(p*3);el.style.transform=`translateY(${(1-outCubic(p))*y}px) scale(${.6+.4*outBack(p)})`}
const CHK='<circle cx="24" cy="24" r="21" fill="none" stroke="#35E0A1" stroke-width="4" class="ring"/><path d="M13 25 L21 33 L36 16" fill="none" stroke="#35E0A1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="chk"/>';

const ICONS={
 shield:`<path d="M270 10 L350 38 V100 C350 148 316 178 270 194 C224 178 190 148 190 100 V38 Z" fill="#2E7BFF" stroke="#fff" stroke-width="5"/><text x="270" y="130" text-anchor="middle" font-size="90" fill="#FFC93C" font-family="WenQuanYi Zen Hei" class="wob">?</text>`,
 wallet:`<rect x="190" y="50" width="160" height="110" rx="18" fill="#2E7BFF" stroke="#fff" stroke-width="5"/><rect x="190" y="50" width="160" height="34" rx="14" fill="#1b57c4" stroke="#fff" stroke-width="5"/><circle cx="318" cy="118" r="14" fill="#FFC93C"/><circle cx="360" cy="40" r="16" fill="#FFC93C" class="wob"/><circle cx="190" cy="30" r="11" fill="#35E0A1" class="wob"/>`,

 store:`<rect x="195" y="85" width="150" height="100" rx="8" fill="#2E7BFF" stroke="#fff" stroke-width="5"/><path d="M185 85 L205 25 H335 L355 85 Z" fill="#FFC93C" stroke="#fff" stroke-width="5"/><path d="M225 25 L215 85 M270 25 V85 M315 25 L325 85" stroke="#fff" stroke-width="4"/><rect x="250" y="125" width="40" height="60" fill="#0B1F3A" stroke="#fff" stroke-width="4"/>`,

const B={};

  ev(S.a+.1,'whoosh',{d:.5,g:.1});ls.forEach((_,i)=>ev(S.a+.6+i*.45,'pop',{f:500+i*80}));

    svg.querySelectorAll('.drop').forEach((n,i)=>{const ph=((t*1.2+i*.33)%1);n.setAttribute('cy',140+ph*70);n.setAttribute('opacity',1-ph)});

B.rows=(S,el)=>{

  ev(S.a+.2,'pop',{f:560});ev(S.a+.4,'pop',{f:620});
  const rows=S.rows.map((r,i)=>{const top=218+116*i;const d=mk(el,'row',{top:top+'px'},`<div class="num b">${i+1}</div><div class="t b">${r.t}</div><div class="s">${r.s}</div><svg width="48" height="48" viewBox="0 0 48 48">${S.mark==='warn'?WARN:CHK}</svg>`);
    const st=S.a+1.2+i*(S.step||2.2);ev(st,'pop',{f:480});ev(st+.9,S.mark==='warn'?'warn':'chime',{f:[880,988,1047,1175][i%4]});return {d,st}});

      d.querySelectorAll('.chk2').forEach(c=>c.style.opacity=lin(t,st+1.2,st+1.3));
      d.style.background=`rgba(255,255,255,${.08+.06*Math.sin(clamp(lin(t,st+.7,st+1.5))*Math.PI)})`;});};

B.chart=(S,el)=>{
  const c0=T(el,130,34,S.title),c1=T(el,610,46,S.bottom);
  const svg=mk(el,'abs',{top:'210px',height:'360px'},`<svg width="540" height="360" viewBox="0 0 540 360"><line x1="60" y1="320" x2="490" y2="320" stroke="#5c7399" stroke-width="2"/><path class="up" d="M60 280 C140 270 200 220 260 190 S400 90 490 50" fill="none" stroke="#35E0A1" stroke-width="7" stroke-linecap="round"/><path class="fl" d="M60 270 L490 270" fill="none" stroke="#FF6B6B" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 12"/><circle class="du" r="11" fill="#35E0A1"/><circle class="df" r="11" fill="#FF6B6B"/><text x="480" y="28" text-anchor="end" fill="#35E0A1" font-size="22" font-family="WenQuanYi Zen Hei" class="lu">${S.up}</text><text x="480" y="302" text-anchor="end" fill="#FF6B6B" font-size="22" font-family="WenQuanYi Zen Hei" class="lf">${S.flat}</text></svg>`);
  ev(S.a+.2,'pop',{f:520});ev(S.a+.8,'whoosh',{d:1.8,g:.1});ev(S.a+2.9,'pop',{f:420,g:.4});
  const up=svg.querySelector('.up');const L=up.getTotalLength();
  return t=>{pop(c0,t,S.a+.2);const g=outCubic(lin(t,S.a+.8,S.a+2.6));up.style.strokeDasharray=L;up.style.strokeDashoffset=L*(1-g);
    const pt=up.getPointAtLength(L*g);const du=svg.querySelector('.du');du.setAttribute('cx',pt.x);du.setAttribute('cy',pt.y);
    const fp=lin(t,S.a+.8,S.a+2.6);svg.querySelector('.fl').setAttribute('d',`M60 270 L${60+430*fp} 270`);const df=svg.querySelector('.df');df.setAttribute('cx',60+430*fp);df.setAttribute('cy',270);
    svg.querySelector('.lu').style.opacity=lin(t,S.a+1.4,S.a+2);svg.querySelector('.lf').style.opacity=lin(t,S.a+1.4,S.a+2);pop(c1,t,S.a+2.9);};
};
B.scatter=(S,el)=>{
  const cols=['#2E7BFF','#35E0A1','#FFC93C','#FF8A5B','#B58CFF','#4DD0E1'];
  const pos=[[40,300],[340,250],[130,470],[350,420],[50,640],[320,620]];
  const grid=[[95,345],[295,345],[95,435],[295,435],[95,525],[295,525]];
  const c1=T(el,120,30,S.cap1),c2=T(el,120,34,S.cap2);
  const frame=mk(el,'',{position:'absolute',left:'60px',top:'290px',width:'420px',height:'320px',borderRadius:'24px',border:'2px solid rgba(255,255,255,.35)',background:'rgba(255,255,255,.07)',opacity:0});
  const items=S.items.map((s,i)=>{const dark=(i===2||i===1||i===5);return mk(el,'b',{position:'absolute',width:'150px',height:'56px',borderRadius:'28px',background:cols[i],color:dark?'#0B1F3A':'#fff',textAlign:'center',lineHeight:'56px',fontSize:'24px',opacity:0},s)});
  items.forEach((_,i)=>ev(S.a+.6+i*.3,'pop',{f:450+i*40}));ev(S.mergeAt,'whoosh',{d:.9,g:.14,up:false});ev(S.mergeAt+1.1,'chime',{f:1047});
  return t=>{
    pop(c1,t,S.a+.2);c1.style.opacity=clamp(lin(t,S.a+.2,S.a+.5)*3)*(1-lin(t,S.mergeAt,S.mergeAt+.3));
    pop(c2,t,S.mergeAt+.6);
    const m=outCubic(lin(t,S.mergeAt,S.mergeAt+1));frame.style.opacity=m;
    items.forEach((d,i)=>{const st=S.a+.6+i*.3;const o=clamp(lin(t,st,st+.3));d.style.opacity=o;
      const dx=Math.sin(t*1.7+i*2)*18,dy=Math.cos(t*1.3+i*1.5)*18;
      const x=pos[i][0]+dx*(1-m)+(grid[i][0]-pos[i][0])*m, y=pos[i][1]+dy*(1-m)+(grid[i][1]-pos[i][1])*m;
      d.style.transform=`translate(${x}px,${y}px) scale(${.6+.4*outBack(lin(t,st,st+.4))})`;d.style.left='0px';d.style.top='0px';});
  };
};
B.stack=(S,el)=>{
  const cap=T(el,130,34,S.cap);const cols=['#2E7BFF','#35E0A1','#FFC93C'],tc=['#fff','#0B1F3A','#0B1F3A'];
  const bl=S.segs.map((s,i)=>mk(el,'b',{position:'absolute',left:'120px',top:(480-i*80)+'px',width:'300px',height:'70px',borderRadius:'16px',background:cols[i],color:tc[i],textAlign:'center',lineHeight:'70px',fontSize:'28px',opacity:0},s));
  const tot=T(el,610,50,S.total,'y');
  S.segs.forEach((_,i)=>ev(S.a+1+i*.8,'pop',{f:300+i*100,g:.4}));ev(S.a+3.6,'chime',{f:880});
  return t=>{pop(cap,t,S.a+.2);bl.forEach((d,i)=>{const st=S.a+1+i*.8;const p=lin(t,st,st+.5);d.style.opacity=clamp(p*4);d.style.transform=`translateY(${-(1-outBounce(p))*300}px)`});
    pop(tot,t,S.a+3.6);tot.style.transform+=` scale(${1+Math.max(0,Math.sin((t-S.a-4)*4))*.05*(t>S.a+4?1:0)})`;};
};
function outBounce(x){const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375}
B.venn=(S,el)=>{
  const c1=T(el,130,34,S.cap1),c2=T(el,130,38,S.cap2);
  const svg=mk(el,'abs',{top:'260px',height:'320px'},`<svg width="540" height="320" viewBox="0 0 540 320"><circle class="a" cy="160" r="110" fill="#2E7BFF" fill-opacity=".75" stroke="#fff" stroke-width="4"/><circle class="b2" cy="160" r="110" fill="#FFC93C" fill-opacity=".75" stroke="#fff" stroke-width="4"/><text class="la" y="165" text-anchor="middle" font-size="30" fill="#fff" font-family="WenQuanYi Zen Hei">${S.la}</text><text class="lb" y="165" text-anchor="middle" font-size="30" fill="#0B1F3A" font-family="WenQuanYi Zen Hei">${S.lb}</text><text class="q" x="270" y="185" text-anchor="middle" font-size="80" fill="#fff" font-family="WenQuanYi Zen Hei">?</text><g class="ck" transform="translate(246,10)"><circle cx="24" cy="24" r="21" fill="#35E0A1"/><path d="M13 25 L21 33 L36 16" fill="none" stroke="#0B1F3A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`);
  ev(S.a+.2,'pop',{f:520});ev(S.split,'whoosh',{d:.8,g:.14});ev(S.split+.9,'chime',{f:988});ev(S.split+.5,'pop',{f:600});
  return t=>{pop(c1,t,S.a+.2);c1.style.opacity=clamp(lin(t,S.a+.2,S.a+.5)*3)*(1-lin(t,S.split,S.split+.3));pop(c2,t,S.split+.6);
    const p=outBack(lin(t,S.split,S.split+1));const sh=(1-lin(t,S.split,S.split+.3))*Math.sin(t*25)*4;
    const x1=235-100*p+sh,x2=305+100*p-sh;svg.style.opacity=clamp(lin(t,S.a+.2,S.a+.6)*3);
    svg.querySelector('.a').setAttribute('cx',x1);svg.querySelector('.b2').setAttribute('cx',x2);
    const la=svg.querySelector('.la'),lb=svg.querySelector('.lb');la.setAttribute('x',x1-(p<.1?40:0));lb.setAttribute('x',x2+(p<.1?40:0));

B.chips=(S,el)=>{

B.stamp=(S,el)=>{
  const ring=mk(el,'',{position:'absolute',left:'110px',top:'200px',width:'320px',height:'320px',borderRadius:'50%',border:'10px solid #FF6B6B',opacity:0});

  return t=>{const p=lin(t,S.a+.4,S.a+.8);const sc=1+(1-outCubic(p))*1.6;const r=-12;
    ring.style.opacity=clamp(p*4);ring.style.transform=`scale(${sc}) rotate(${r}deg)`;tx.style.opacity=clamp(p*4);tx.style.transform=`scale(${sc}) rotate(${r}deg)`;

B.cta=(S,el)=>{
  const h=T(el,120,34,S.head);
  const pill=mk(el,'pill b',{left:'90px',top:'200px',width:'360px',height:'110px',lineHeight:'110px',fontSize:S.typed?'48px':'34px'},`<span id="typed${S.a}"></span>${S.typed?'<span id="caret'+S.a+'">|</span>':''}`);

  return t=>{pop(h,t,S.a+.2);const bb=outBack(lin(t,S.a+.5,S.a+1.1));
    let press=1;if(!S.typed){const q=lin(t,S.a+2,S.a+2.25);press=1-.08*Math.sin(q*Math.PI)}

};
